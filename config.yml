engine:
  speed: 4
  autoclose: False
recorder:
  file: record/test.pickle
  replay:
    - trailmarker
    - preprocessor
    - hiddenmarkov
    - detector
webcam:
  deviceIndex: 0
  width: 1280
  height: 720
  dtype: u8
  flip: True
preprocessor:
  finger_idx: 8
  max_lost: 10
  min_points: 8    # kuerzere Aufnahmen verwerfen (siehe labeling.MIN_SEQUENCE_LEN)
  n_resample: 32   # feste Punktzahl nach Bogenlängen-Resampling (muss zum Training passen)
gesturecontroller:
  trigger_frames: 3   # so viele Frames muss eine Geste halten, damit sie zaehlt (Entprellung)
trailmarker:
  finger_idx: 8
  max_lost: 10
  trail_length: 300   # genug Platz fuer einen ganzen "gemalten" Buchstaben